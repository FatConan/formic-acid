@import de.themonstrouscavalca.formicacid.templates.LinkConfig

@(config: LinkConfig)
<a @if(config.getId() != null && config.getId() != ""){id="@config.getId"} class="@config.getClasses" title="@config.getTitle" href="@config.getHref" @config.getAttributes>
@if(config.isSpanWrapped){
  <span>@config.getLabel</span>
}else{
  @config.getLabel
}
</a>
